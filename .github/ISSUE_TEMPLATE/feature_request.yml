name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement.
        For large ideas, consider opening a discussion first.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this solve? Who is affected?
      placeholder: "As a contributor, I want non-interactive create flags so CI can seed objects..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you want
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about (optional)

  - type: dropdown
    id: scope
    attributes:
      label: Estimated scope
      options:
        - Small (docs/UX copy)
        - Medium (single feature slice)
        - Large (architecture change)
    validations:
      required: true

  - type: checkboxes
    id: willing
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this
          required: false
