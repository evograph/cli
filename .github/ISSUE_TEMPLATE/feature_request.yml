name: ✨ Feature request
description: Share an idea to evolve Evograph.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## 💡 Love this energy

        Thanks for suggesting an improvement. For **big** ideas, consider a [Discussion](https://github.com/evograph/cli/discussions) first so we can shape it together.

  - type: textarea
    id: problem
    attributes:
      label: 🎯 Problem statement
      description: What problem does this solve? Who is affected?
      placeholder: "As a team lead, I want `ecs graph` export so I can share evolution in reviews..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 🚀 Proposed solution
      description: Describe the behavior you want
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 🔀 Alternatives considered
      description: Other approaches you thought about (optional)

  - type: dropdown
    id: scope
    attributes:
      label: 📐 Estimated scope
      options:
        - "🪶 Small (docs / UX copy)"
        - "📦 Medium (single feature slice)"
        - "🏗️ Large (architecture change)"
    validations:
      required: true

  - type: checkboxes
    id: willing
    attributes:
      label: 🤝 Contribution
      options:
        - label: I am willing to open a pull request for this 🎉
          required: false
