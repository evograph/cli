name: 🐛 Bug report
description: Something broke? Help us squash it.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🙏 Thanks for the report

        You're helping Evograph get better. Please include enough detail so we can **reproduce** the issue locally.

  - type: textarea
    id: summary
    attributes:
      label: 📝 Summary
      description: A clear and concise description of the bug
      placeholder: "Running `ecs link` with an abbreviated ID fails with..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 🔁 Steps to reproduce
      description: Minimal commands to reproduce the behavior
      placeholder: |
        1. `ecs init`
        2. `ecs create problem`
        3. `ecs link <id> <id> solves`
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: ✅ Expected behavior
      placeholder: What you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: ❌ Actual behavior
      placeholder: What actually happened (paste full error output)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 📦 Evograph / `@evograph/cli` version
      placeholder: "0.1.0 or commit SHA"
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: 🟢 Node.js version
      placeholder: "node -v output"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 💻 Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 📎 Additional context
      description: Screenshots, logs, or related issues (optional)
