name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: CI (Node ${{ matrix.node }})
    strategy:
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime dependencies
        run: npm audit --omit=dev

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify publish tarball
        run: |
          npm pack --dry-run 2>&1 | tee pack.log
          grep -q 'dist/cli/index.js' pack.log
          grep -q 'dist/cli/run.js' pack.log
          grep -q 'bin/ecs.js' pack.log
          if grep -q 'src/cli/index.ts' pack.log; then
            echo "Publish tarball must not include src/"
            exit 1
          fi
